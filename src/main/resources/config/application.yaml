application:
  name: @app.name@
  version: @app.version@
  build: @app.build@
  buildTime: @app.buildTime@

server:
  port: 9892
  timeZone: Europe/Madrid
  servlet:
    context-path: /
    api-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  application.name: @app.name@
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - application-base.yaml
      - application-flyway.yaml
      - application-security.yaml
      - optional:application-@spring.profiles.active@.yaml

logging:
  file:
    path: dist/logs